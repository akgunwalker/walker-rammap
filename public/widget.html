<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:#0b0e12ee;color:#fff;border:1px solid #34404a;border-radius:14px;font:12px system-ui;user-select:none;-webkit-app-region:drag}header{display:flex;justify-content:space-between;color:#c8ff3d;font-weight:700}small{color:#7c8591}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.card{background:#151a20;padding:10px;border-radius:8px}.card strong,.card span{display:block}.card strong{font:20px monospace}.bar{height:3px;background:#29303a;margin-top:6px}.bar i{display:block;height:100%;background:#c8ff3d}</style></head>
<body><header><span>WALKER RAMMAP</span><small>by akgunwalker</small></header><div class="grid"><div class="card"><span>RAM</span><strong id="ram">—</strong><div class="bar"><i id="ramBar"></i></div></div><div class="card"><span>CPU</span><strong id="cpu">—</strong><div class="bar"><i id="cpuBar"></i></div></div><div class="card"><span>GPU</span><strong id="gpu">—</strong></div><div class="card"><span>SAĞLIK</span><strong id="health">—</strong></div></div>
<script>const $=x=>document.getElementById(x),q=new URLSearchParams(location.search),a=q.get("advanced"),s=q.get("session");async function tick(){try{const[m,h]=await Promise.all([fetch("/api/memory").then(r=>r.json()),fetch(`${a}/api/health`,{headers:{"X-Walker-Session":s}}).then(r=>r.json())]),ram=Math.round(m.used/m.total*100);$("ram").textContent=`%${ram}`;$("cpu").textContent=`%${m.cpu}`;$("gpu").textContent=`%${m.gpu}`;$("health").textContent=h.score;$("ramBar").style.width=ram+"%";$("cpuBar").style.width=m.cpu+"%"}catch{}}tick();setInterval(tick,3000)</script></body></html>
